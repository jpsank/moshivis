[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyuteye"
version = "0.0.0"
description = "Kyutai with an 'eye'"
authors = [
    { name = "Amelie Royer", email = "amelie@kyutai.org" },
    { name = "Moritz Boehle", email = "moritz@kyutai.org" }
]
maintainers = [{ name = "Amelie Royer", email = "amelie@kyutai.org" }]
keywords = []
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "einops",
    "huggingface_hub",
    # 0.2.13 is the first upstream release that ships ``set_exec_mask`` /
    # mask-aware ``reset_streaming`` on ``StreamingModule`` (and MimiModel),
    # which the BatchedServerState in this backend relies on. Earlier 0.2.x
    # may work but is untested.
    "moshi>=0.2.13",
    "numpy<2",
    "sentencepiece",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "tqdm",
    "transformers==4.47.0",
    "triton",
    "fire",
    "rich",
    "pyyaml",
    "black",
    "setuptools",
    "sphn >= 0.1.4",
]

[project.optional-dependencies]
omni = [
    "openai >= 1.0",  # default LLM-based retriever in kyuteye.omni
    "httpx >= 0.27",  # ARC encoder client (streaming_sum injection mode)
]
arc = [
    # In-process ARC encoder (kyuteye.conditioners.arc_encoder).
    # xformers needs a CUDA + PyTorch combo it likes; pin loosely.
    "xformers >= 0.0.27",
]

[project.scripts]
server = "kyuteye.server:main"
sanity-check = "kyuteye.server:sanity_check"
# train.py lives in scripts/ rather than as a kyuteye module since it's
# a launcher (driven by torchrun under Slurm), not library code. Invoke
# via ``torchrun ... scripts/train.py``; the Slurm template does this.

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["fire", "yaml", "setuptools", "transformers.*",
          "torchvision.*", "timm.*", "sentencepiece", "moshi.*",
          "huggingface_hub", "sphn"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "mypy==1.11.2",
    "pylint>=3.3.4",
]
